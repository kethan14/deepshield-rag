name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    env:
      UV_PYTHON: "3.11.9"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install "$UV_PYTHON"

      - name: Synchronize locked dependencies
        run: uv sync --locked --extra dev

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Run Ruff
        run: uv run --no-sync ruff check .

      - name: Run mypy
        run: uv run --no-sync mypy src tests

      - name: Confirm corpus schema is current
        run: >-
          uv run --no-sync python -m deepshield_api.corpus.cli schema --check
          --output ../data/manifests/source-manifest.schema.json

      - name: Confirm classifier selection contract and evidence
        run: |
          uv run --no-sync python -m deepshield_api.classifier.cli schema selection --check --output ../data/classifier/selection-report.schema.json
          uv run --no-sync python -m deepshield_api.classifier.cli schema review --check --output ../data/classifier/review-report.schema.json
          uv run --no-sync python -m deepshield_api.classifier.cli schema training --check --output ../data/classifier/training-report.schema.json
          uv run --no-sync python -m deepshield_api.classifier.cli validate-selection ../data/classifier/selection-report.v1.json --repository-root ..

      - name: Run tests with coverage
        run: uv run --no-sync pytest --cov=deepshield_api --cov-report=term-missing

      - name: Check generated evaluation artifacts
        run: |
          uv run --no-sync python -m deepshield_api.evaluation.cli generate --repository-root .. --check
          uv run --no-sync python -m deepshield_api.evaluation.cli score-schema --check --output ../data/evaluation/score-report.schema.json
          uv run --no-sync python -m deepshield_api.evaluation.cli adjudication-schema --check --output ../data/evaluation/adjudication-manifest.schema.json
          uv run --no-sync python -m deepshield_api.evaluation.cli adjudication-agreement-schema --check --output ../data/evaluation/adjudication-agreement.schema.json

      - name: Confirm generated files are unchanged
        run: git diff --exit-code
