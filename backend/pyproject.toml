[build-system]
requires = ["setuptools>=80,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "deepshield-rag-api"
version = "0.1.0"
description = "Backend API for the DeepShield-RAG security evaluation platform."
authors = [{ name = "Kethan Kanithi" }]
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.13.0",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.7",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["deepshield_api*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["deepshield_api"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["deepshield_api"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
